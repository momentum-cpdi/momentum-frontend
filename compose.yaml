name: momentum-frontend

services:
  frontend:
    build:
      context: .
      args:
        # Vide = l'application appelle /api sur sa propre origine (proxy nginx, pas de CORS).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: momentum-frontend:local
    container_name: momentum-frontend
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8080}
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - default

# Réseau commun avec le backend (momentum-backend/docker-compose.yml). Il est créé par le premier
# des deux projets lancé et réutilisé par l'autre.
networks:
  default:
    name: momentum-net