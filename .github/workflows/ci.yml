name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for fixed HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Generate Trivy JSON report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn

  quality:
    timeout-minutes: 15
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node 
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm run test.unit.ci
      - name: Typecheck and build
        run: npm run build

  dockerfile-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  end-to-end:
    timeout-minutes: 15
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          start: npm run dev -- --host 0.0.0.0
          wait-on: 'http://127.0.0.1:5173'
          wait-on-timeout: 120
          browser: chrome

  smoke-test:
    needs: [security, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Start the production container and check /health
        run: |
          docker compose up --detach --build
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs frontend
          exit 1
      - name: Check security headers and API fallback
        run: |
          curl --fail --silent --head http://127.0.0.1:8081/ | grep -i "content-security-policy"
          test "$(curl --silent --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8081/api/sports)" = "503"
      - name: Stop containers
        if: always()
        run: docker compose down
