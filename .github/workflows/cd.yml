name: CD

# main      -> image `edge` + staging
# tag vX.Y.Z -> image versionnée + staging + production (après validation du staging)
# workflow_dispatch -> relance manuelle (sur la branche choisie)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image to GHCR
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha
      - name: Build and push (with provenance and SBOM)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image reference by digest (lower-case repository)
        id: ref
        env:
          REPO: ${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "image=ghcr.io/${REPO,,}@${DIGEST}" >> "$GITHUB_OUTPUT"
      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ref.outputs.image }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # Staging "sans serveur" : l'image publiée est tirée du registre et exécutée sur le runner.
  # Elle valide l'artefact réellement livré (et non celui de la CI) avant toute mise en production.
  staging-verify:
    name: Staging - run the published image
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and start the published image
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          docker pull "$IMAGE"
          docker run --detach --name staging -p 8081:8080 "$IMAGE"
          for _ in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8081/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs staging
          exit 1
      - name: Smoke tests
        run: |
          curl --fail --silent --head http://127.0.0.1:8081/ | grep -i "content-security-policy"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/home)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8081/api/sports)" = "503"
      - name: Container logs
        if: always()
        run: docker logs staging
      - name: Stop
        if: always()
        run: docker rm --force staging

  # Staging sur un serveur : ignoré tant que la variable de dépôt STAGING_HOST n'est pas définie.
  deploy-staging:
    name: Deploy to staging
    needs: [publish, staging-verify]
    if: vars.STAGING_HOST != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ${{ needs.publish.outputs.image }}
      host: ${{ vars.STAGING_HOST }}
      user: ${{ vars.STAGING_USER }}
      path: ${{ vars.STAGING_PATH || '/opt/momentum-frontend-staging' }}
      url: ${{ vars.STAGING_URL }}
      port: ${{ vars.STAGING_PORT || '8081' }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}

  # Production : tag de version uniquement, après un staging réussi (ou non configuré).
  deploy-production:
    name: Deploy to production
    needs: [publish, staging-verify, deploy-staging]
    if: >-
      startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_HOST != '' && !cancelled() &&
      needs.staging-verify.result == 'success' &&
      (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image: ${{ needs.publish.outputs.image }}
      host: ${{ vars.DEPLOY_HOST }}
      user: ${{ vars.DEPLOY_USER }}
      path: ${{ vars.DEPLOY_PATH || '/opt/momentum-frontend' }}
      url: ${{ vars.DEPLOY_URL }}
      port: ${{ vars.DEPLOY_PORT || '8081' }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}