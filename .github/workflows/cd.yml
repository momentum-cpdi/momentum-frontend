name: CD

# main -> image `edge` ; tag vX.Y.Z -> image versionnée + déploiement (si configuré).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image to GHCR
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha
      - name: Build and push (with provenance and SBOM)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy (SSH + docker compose)
    needs: publish
    # Uniquement pour un tag de version et si un serveur est configuré (variable DEPLOY_HOST).
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/momentum-frontend' }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload compose file and deploy
        env:
          TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes $TARGET"
          $SSH "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes compose.yaml \
            "$TARGET:$DEPLOY_PATH/compose.yaml"
          $SSH "cd '$DEPLOY_PATH' && FRONTEND_IMAGE='$IMAGE' docker compose pull && FRONTEND_IMAGE='$IMAGE' docker compose up -d --no-build --remove-orphans"
      - name: Verify the deployment
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for _ in {1..30}; do
            if curl --fail --silent "$DEPLOY_URL/health"; then
              exit 0
            fi
            sleep 3
          done
          echo "Le déploiement ne répond pas sur /health" >&2
          exit 1
      - name: Explain the rollback
        if: failure()
        run: echo "::error::Déploiement en échec - retour arrière en relançant ce workflow sur le tag précédent (voir docs/ops/runbook.md)."